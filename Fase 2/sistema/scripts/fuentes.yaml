# Datasets públicos con que se entrena el detector (#31). Cada uno tiene su fila en
# docs/producto/07-datasets.md §2.bis, con la licencia verificada en la fuente primaria.
#
# clases: categoría tal como viene en el dataset -> clase propia (persona, casco, chaleco,
#         cabeza, sin_chaleco; las dos últimas son evidencia positiva, ADR-013), o null
#         para descartarla a propósito. Una categoría que no esté aquí DETIENE la
#         preparación: así nada entra traducido por suposición.
# exhaustivas: clases que el dataset marca en TODAS sus imágenes. Las personas que falten
#         las completa el detector COCO (anotación `automatica`).
#
# Los nombres de categoría se confirman en la primera descarga: si el dataset trae otros,
# la preparación se detiene y dice cuáles.

fuentes:
  - nombre: construction-site-safety
    licencia: CC BY 4.0  # exige atribución en el README y el informe final
    origen: {tipo: roboflow, proyecto: roboflow-universe-projects/construction-site-safety, version: 30}
    clases:
      Hardhat: casco
      Safety Vest: chaleco
      Person: persona
      NO-Hardhat: cabeza        # 402 cajas, ninguna solapa con un Hardhat (ADR-013)
      NO-Safety Vest: sin_chaleco
      Mask: null
      NO-Mask: null
      Safety Cone: null
      machinery: null
      vehicle: null
      # Versión 30 (verificada el 2026-10-01): 717 imágenes y estas categorías además.
      Gloves: null    # guantes existe como clase, pero no entra en la v1
      Ladder: null
      Excavator: null
      wheel loader: null
      dump truck: null
      truck: null
      truck and trailer: null
      trailer: null
      semi: null
      SUV: null
      sedan: null
      van: null
      mini-van: null
      bus: null
      fire hydrant: null
    exhaustivas: [casco, chaleco]
    # Roboflow parte por cuadro: cuadros de un mismo video caían en train y en test. Estos
    # patrones reconocen el video en el nombre y lo mandan entero a una partición.
    # `IMG_0871_mp4-11_jpg` y `IMG_0871_MOV-12_jpg` son el mismo video (159 imágenes).
    # `youtube-N` no dice de qué video viene (192 imágenes): van todas como un solo grupo.
    grupos:
      - '(?i)^(.*?)_(?:mp4|mov)-\d+_'
      - '^(youtube)-'

  # Son las imágenes de Hard Hat Workers (Roboflow, CC0), redistribuidas en Kaggle: archivos
  # `hard_hat_workers*.png`. Por eso Hard Hat Workers no figura aparte: serían duplicados.
  # Verificado el 2026-10-01: 5000 imágenes; `person` aparece en 158 (se completa).
  - nombre: hard-hat-detection
    licencia: CC0 1.0
    origen: {tipo: kaggle, dataset: andrewmvd/hard-hat-detection, formato: voc}
    clases:
      helmet: casco
      head: cabeza  # cabeza sin casco (ADR-013): 5.785 cajas, solo 4 solapan con un helmet
      person: persona
    exhaustivas: [casco]

  # Refuerzo de chaleco para la segunda ronda (#37). Versión 1: la única sin aumento ni
  # redimensionado (verificado el 2026-10-15: 3.897 imágenes, licencia en README.dataset.txt).
  # La ficha web dice `safety_vest`; la descarga de la v1 trae estos nombres.
  - nombre: safety-vests
    licencia: CC BY 4.0  # exige atribución en el README y el informe final
    origen: {tipo: roboflow, proyecto: roboflow-universe-projects/safety-vests, version: 1}
    clases:
      Safety Vest: chaleco
      NO-Safety Vest: sin_chaleco  # persona sin chaleco (ADR-013): 3 de 2.024 solapan con un chaleco
    exhaustivas: [chaleco]  # los cascos no tienen caja: los completa el modelo EPP
    # Hay overoles marcados como chaleco. No se filtran por forma: en una muestra de 24 cajas
    # con alto/ancho > 2,5, dos tercios eran chalecos de perfil o tapados (07-datasets).

  # Lote 5 (epp-v4): cuadros de 7 timelapses de obra en altura (canal «Construction Camera
  # Swiss», 07-datasets lote 5), corregidos a mano en CVAT y exportados en COCO 1.0. Solo
  # entrenamiento y validación: la prueba sigue siendo de los lotes 3 y 4.
  - nombre: lote5-cctv-cc
    licencia: CC BY (canal «Construction Camera Swiss»)  # exige atribución, ver el README
    origen: {tipo: cvat, formato: coco-cvat}
    clases:
      persona: persona
      casco: casco
      chaleco: chaleco
      cabeza: cabeza
      sin_chaleco: sin_chaleco
    # Corrección humana de las cinco clases en cada cuadro: no se completa con modelos (el
    # modelo es justo el que falla aquí). El script no puede saber qué cuadros
    # están sin corregir (guía §9: no entran): hay que quitarlos de la tarea antes de exportar.
    exhaustivas: [persona, casco, chaleco, cabeza, sin_chaleco]
    grupos:
      - '(?i)^(.+)_\d+\.jpe?g$'  # el id del video es el nombre del cuadro sin el número
    # Procedencia: solo estos 7 videos (07-datasets lote 5) pueden entrar; otro id detiene todo.
    videos: [EnFcSvWYhY4, v2cCZj7g2bA, NLlyuKZKHKo, UVmFsIoasJ4, SfQxyGXQ_I0, bE9eUhZw_JQ, rwyGL9gnLh8]
    # Etiquetas de imagen de CVAT (no son cajas): pueden figurar en el export sin anotaciones.
    etiquetas: [tiene_pequenos, negativo_duro, grupo_denso]
    # Un video entero por partición. Valid: NLlyuKZKHKo, la obra con más cabezas por cuadro
    # (4,5; las otras seis, de 1,25 a 3,4): 46 de 473 cuadros (9,7 %) y 209 de 1.206 cabezas
    # del pre-marcado (17 %), 216 personas. Cifras del pre-marcado r4, no de la corrección.
    # La partición es por video. Los 7 son obras distintas, comprobado a ojo el 2026-10-27 con
    # el cuadro 20 de cada uno: estación de Aarau, fachada con andamios, Adliswil, Uster, ETH,
    # demolición en Diessenhofen y estadio SCL Tiger.
    particion:
      por_defecto: train
      valid: [NLlyuKZKHKo]
