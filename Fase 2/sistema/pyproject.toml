[project]
name = "guardian-epp"
version = "0.1.0"
description = "Guardian EPP - deteccion de uso de EPP y condiciones inseguras sobre video de faena"
requires-python = ">=3.12,<3.14"
dependencies = ["gepp-core", "gepp-api", "gepp-vision", "gepp-worker"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
gepp-core   = { workspace = true }
gepp-api    = { workspace = true }
gepp-vision = { workspace = true }
gepp-worker = { workspace = true }

[dependency-groups]
dev  = [{ include-group = "test" }, { include-group = "lint" }]
test = ["pytest>=8", "pytest-cov", "pytest-asyncio", "httpx"]
lint = ["ruff>=0.16", "mypy>=1.11"]

[tool.uv]
default-groups = ["dev"]

# ─────────────────────────── calidad ───────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ARG", "DTZ"]
# DTZ prohibe datetime.now() sin zona horaria: refuerza la regla del reloj (ADR-005)

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["cv2.*", "rfdetr.*", "trackers.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests", "packages"]
markers = [
  "gpu: requiere GPU CUDA (no corre en CI)",
  "slow: tarda mas de 5 s",
  "integration: toca base de datos o sistema de archivos real",
]

[tool.coverage.run]
source = ["packages"]
branch = true
relative_files = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 60
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
