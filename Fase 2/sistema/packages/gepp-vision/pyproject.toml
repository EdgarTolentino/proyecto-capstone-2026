[project]
name = "gepp-vision"
version = "0.1.0"
description = "Vision: deteccion, seguimiento, muestreo y descripcion selectiva"
requires-python = ">=3.12,<3.14"
dependencies = ["gepp-core", "numpy>=2.0"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gepp_vision"
module-root = "src"

[tool.uv.sources]
gepp-core = { workspace = true }
