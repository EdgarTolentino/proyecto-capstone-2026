[project]
name = "gepp-api"
version = "0.1.0"
description = "API HTTP y persistencia. NO importa gepp-vision (ver ADR-007)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "gepp-bd",
    "gepp-core",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gepp_api"
module-root = "src"

[tool.uv.sources]
gepp-core = { workspace = true }
gepp-bd = { workspace = true }
