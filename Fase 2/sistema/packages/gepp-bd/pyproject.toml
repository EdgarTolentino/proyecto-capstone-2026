[project]
name = "gepp-bd"
version = "0.1.0"
description = "Persistencia compartida: modelos, migraciones y repositorios. Dueño del esquema (ADR-012)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "gepp-core",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gepp_bd"
module-root = "src"

[tool.uv.sources]
gepp-core = { workspace = true }

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260906",
]
