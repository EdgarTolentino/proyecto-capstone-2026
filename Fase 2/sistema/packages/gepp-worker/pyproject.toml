[project]
name = "gepp-worker"
version = "0.1.0"
description = "Ingesta: carpeta vigilada (v1) y RTSP (v2)"
requires-python = ">=3.12,<3.14"
dependencies = ["gepp-core", "gepp-vision", "numpy>=2.0"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gepp_worker"
module-root = "src"

[tool.uv.sources]
gepp-core = { workspace = true }
gepp-vision = { workspace = true }
