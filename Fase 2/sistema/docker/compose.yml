name: guardian-epp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gepp
      POSTGRES_PASSWORD: gepp_dev
      POSTGRES_DB: gepp
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gepp"]
      interval: 5s
      retries: 10

  redis:
    # 7.2: la última con licencia BSD. `7-alpine` ya trae la 7.4 (RSALv2/SSPL), prohibida por ADR-002.
    # Si venías de la 7.4 y Redis no arranca («Can't handle RDB format version 12»), el volumen
    # anónimo trae su RDB: `docker compose -f docker/compose.yml up -d -V redis` lo descarta (cola de desarrollo).
    image: redis:7.2-alpine
    ports: ["6379:6379"]

  # Publica los videos grabados como cámaras RTSP falsas.
  # Permite probar la ruta de la v2 desde la semana 6, sin cámaras ni faena (ADR-005).
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports: ["8554:8554"]
    profiles: [rtsp]

volumes:
  pgdata:
