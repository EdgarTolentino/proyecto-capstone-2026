version: 2
updates:
  - package-ecosystem: uv
    directory: /Fase 2/sistema
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev:
        patterns: ["ruff", "mypy", "pytest*"]

  - package-ecosystem: npm
    directory: /Fase 2/sistema/apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
